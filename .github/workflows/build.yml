
name: Build Naruto APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip NarutoNinjaHandSigns-APK-CloudBuild.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon -p NarutoNinjaHandSigns assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Naruto-Ninja-Hand-Signs-APK
          path: NarutoNinjaHandSigns/app/build/outputs/apk/debug/app-debug.apk
